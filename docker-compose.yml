# Prerequisites:
#   1. Copy .env.example to .env and set your MinIO credentials
#   2. Place your MinIO AIStor license at ./docker/minio/minio.license
#
# Usage:
#   docker compose up -d        # start all services
#   docker compose ps           # check health status
#   docker compose down         # stop all services
#   docker compose down -v      # stop and remove volumes

services:

  # Storage Layer
  minio:
    # image: quay.io/minio/aistor/minio:latest
    image: quay.io/minio/minio:latest
    container_name: storage-layer
    ports:
      - "${STORAGE_SERVER_IP}:9000:9000"
      - "${STORAGE_SERVER_IP}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # volumes:
    #   - ./docker/minio/data:/mnt/data
    #   - ./docker/minio/minio.license:/minio.license:ro
    # command: server /mnt/data --console-address ":9001" --license /minio.license
    command: server /mnt/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - lakehouse

  # Metadata Layer
  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.5
    container_name: metadata-layer
    ports:
      - "${STORAGE_SERVER_IP}:19120:19120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - lakehouse

  # API Layer
  trino:
    image: trinodb/trino:latest
    container_name: api-layer
    ports:
      - "${STORAGE_SERVER_IP}:8080:8080"
    environment:
      # Passed through so Trino's ${ENV:...} substitution in catalog properties can read them
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/catalog/minio.properties:/etc/trino/catalog/minio.properties:ro
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

networks:
  lakehouse:
    driver: bridge
