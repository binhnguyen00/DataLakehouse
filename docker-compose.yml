# Prerequisites:
#   Copy .env.example to .env and set your credentials
# Usage:
#   docker compose up -d        # start all services
#   docker compose ps           # check health status
#   docker compose down         # stop all services
#   docker compose down -v      # stop and remove volumes

services:

  # storage layer
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: storage-layer
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/warehouse/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - lakehouse

  # metadata layer
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: metadata-layer
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - lakehouse

  # API layer
  trino:
    image: trinodb/trino:latest
    container_name: api-layer
    ports:
      - "8080:8080"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SHOW SCHEMAS FROM lakehouse"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

  # consumption layer
  superset-init:
    build:
      context: ./docker/superset
    image: data-lakehouse-superset:6.1.0-trino
    container_name: consumption-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
    command: ["/app/docker/docker-init.sh"]
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      disable: true
    networks:
      - lakehouse

  superset:
    build:
      context: ./docker/superset
    image: data-lakehouse-superset:6.1.0-trino
    container_name: consumption-layer
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

networks:
  lakehouse:
    driver: bridge

volumes:
  superset_home:
